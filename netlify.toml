[build]
  # Portfolio en pause : seule la page « site en construction » est publiée.
  # Pour remettre le portfolio en ligne, repassez publish = "."
  publish = "construction"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
